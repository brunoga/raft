syntax = "proto3";

package raft;

option go_package = "github.com/brunoga/raft/transport/grpctransport/internal/raftpb";

// Wire compatibility
//
// Nodes are upgraded one at a time, so every version of this file has to talk
// to the one before it. Protobuf handles most of that: a field added with a
// fresh number is ignored by a peer that does not know it, and a field a peer
// stops sending reads as its zero value.
//
// What it does not handle is a field number changing meaning. Renumber a
// field, reuse the number of a deleted one, or change a type in place, and
// both sides still parse the message -- into different values. A leader_commit
// read as a prev_log_index does not fail a request; it commits the wrong
// entries, with no error to see, for as long as the upgrade window lasts.
//
// So:
//
//   - Add fields with numbers never used before. Never renumber or retype one.
//   - When deleting a field, mark its number `reserved` so nothing reuses it.
//   - Adding an RPC is safe only against a peer that has it; one that does not
//     answers Unimplemented, and the caller has to treat that as "this peer is
//     older" rather than as a failed RPC.
//   - Renaming or removing an RPC breaks every older peer: gRPC routes on the
//     method name.
//
// wire_compat_internal_test.go holds the current contract and fails on any of
// these, so that a breaking change costs a code review rather than a rolling
// upgrade.

// RaftService exposes the Raft RPCs over gRPC.
service RaftService {
  rpc RequestVote(RequestVoteRequest)           returns (RequestVoteResponse);
  rpc AppendEntries(AppendEntriesRequest)        returns (AppendEntriesResponse);
  rpc InstallSnapshot(InstallSnapshotRequest)    returns (InstallSnapshotResponse);
  rpc TimeoutNow(TimeoutNowRequest)              returns (TimeoutNowResponse);
  rpc ReadIndex(ReadIndexRequest)                returns (ReadIndexResponse);
  rpc BatchHeartbeats(BatchedHeartbeatRequest)   returns (BatchedHeartbeatResponse);
}

// ---- RequestVote -----------------------------------------------------------

message RequestVoteRequest {
  uint64 group_id       = 1;
  uint64 term           = 2;
  string candidate_id   = 3;
  uint64 last_log_index = 4;
  uint64 last_log_term  = 5;
  bool   pre_vote       = 6;
}

message RequestVoteResponse {
  uint64 term         = 1;
  bool   vote_granted = 2;
}

// ---- AppendEntries ---------------------------------------------------------

message LogEntry {
  uint64 index   = 1;
  uint64 term    = 2;
  bytes  command = 3;
}

message AppendEntriesRequest {
  uint64   group_id       = 1;
  uint64   term           = 2;
  string   leader_id      = 3;
  uint64   prev_log_index = 4;
  uint64   prev_log_term  = 5;
  repeated LogEntry entries = 6;
  uint64   leader_commit  = 7;
  uint64   read_barrier   = 8;
}

message AppendEntriesResponse {
  uint64 term           = 1;
  bool   success        = 2;
  uint64 conflict_index = 3;
  uint64 conflict_term  = 4;
}

// ---- InstallSnapshot -------------------------------------------------------

message InstallSnapshotRequest {
  uint64 group_id            = 1;
  uint64 term                = 2;
  string leader_id           = 3;
  uint64 last_included_index = 4;
  uint64 last_included_term  = 5;
  int64  offset              = 6;
  bytes  data                = 7;
  bool   done                = 8;
}

message InstallSnapshotResponse {
  uint64 term = 1;
}

// ---- TimeoutNow ------------------------------------------------------------

message TimeoutNowRequest {
  uint64 group_id  = 1;
  uint64 term      = 2;
  string leader_id = 3;
}

message TimeoutNowResponse {
  uint64 term = 1;
}

// ---- ReadIndex -------------------------------------------------------------

message ReadIndexRequest {
  uint64 group_id = 1;
  uint64 term     = 2;
}

message ReadIndexResponse {
  uint64 term      = 1;
  uint64 index     = 2;
  // leader_id is set (and index is 0) when the receiver is not the leader.
  // Clients should retry the request on the indicated node.
  string leader_id = 3;
}

// ---- BatchHeartbeats -------------------------------------------------------
//
// In multi-Raft deployments with G groups and P peers, naively sending one
// AppendEntries heartbeat per (group, peer) pair costs O(G×P) RPCs per tick.
// BatchHeartbeats collapses all heartbeats to the same peer into a single RPC,
// reducing cost to O(P) per tick.

// HeartbeatEntry carries the fields of an empty AppendEntries for one group.
// read_barrier is non-zero for linearizable-read barrier rounds; it is
// forwarded verbatim to HandleAppendEntries so the leader can match responses
// to pending ReadIndex futures.
message HeartbeatEntry {
  uint64 group_id       = 1;
  uint64 term           = 2;
  string leader_id      = 3;
  uint64 prev_log_index = 4;
  uint64 prev_log_term  = 5;
  uint64 leader_commit  = 6;
  uint64 read_barrier   = 7;
}

// HeartbeatResult is the per-group response to a HeartbeatEntry.
//
// A result reports one of two outcomes:
//
//   - A Raft-level answer: error_code is OK (0) and term/success/conflict_index/
//     conflict_term mirror the fields of AppendEntriesResponse exactly. A
//     success=false result is a genuine log mismatch and the conflict hints
//     must be honoured by the leader's fast-backup logic.
//   - A dispatch failure: error_code is a non-zero gRPC status code (the group
//     is not registered on the receiver, its handler returned an error, or the
//     RPC context was cancelled before the entry could be dispatched). The
//     remaining fields are unset and the sender turns the result into a Go
//     error so the leader treats the heartbeat as dropped rather than as a log
//     mismatch.
message HeartbeatResult {
  uint64 group_id       = 1;
  uint64 term           = 2;
  bool   success        = 3;
  uint64 conflict_index = 4;
  uint64 conflict_term  = 5;
  // error_code is a google.rpc.Code value; 0 (OK) means the entry was
  // dispatched and term/success/conflict_* carry the Raft-level answer.
  uint32 error_code     = 6;
  string error_message  = 7;
}

message BatchedHeartbeatRequest {
  repeated HeartbeatEntry entries = 1;
}

message BatchedHeartbeatResponse {
  repeated HeartbeatResult results = 1;
}
