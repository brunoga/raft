version: "2"

run:
  tests: true
  # v2 disables the timeout by default; keep the explicit bound so a wedged
  # run fails fast instead of burning the whole CI job.
  timeout: 5m

linters:
  # errcheck, govet, ineffassign, staticcheck and unused are enabled by
  # default; the list below is what we add on top of them.
  enable:
    - bodyclose
    - gocritic
    - misspell
    - nilerr
    - revive
    - sqlclosecheck
    - unconvert
  settings:
    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance
      disabled-checks:
        - wrapperFunc
        - rangeValCopy
    govet:
      enable:
        - shadow
    revive:
      rules:
        - name: package-comments
          disabled: true
  exclusions:
    generated: lax

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
